<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report writer — Multi-Agent Report Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/trace.css">
<style>
/* Only what / has and /dev does not: the question box, and a token line where the
   cost meter would be. No meter here — the multiple is the run over the mean of six
   single-agent runs on six fixed topics, and against a question typed into this box
   that denominator is the cost of a different task. */
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
/* The masthead: the project name as the title, one line under it, and a way across to
   the instrument view. .eyebrow is 11px/500 in trace.css because on /dev it sits above
   a heading; here it IS the heading, so it takes the size and weight to match. */
.head .eyebrow{font-size:19px;font-weight:700;letter-spacing:.1em;
  line-height:1.15;margin-bottom:7px}

.controls{margin-bottom:26px}
textarea{
  width:100%;min-height:76px;resize:vertical;background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;padding:12px 13px;color:var(--ink);
  font:400 15px/1.5 Archivo,sans-serif}
textarea:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:11px;flex-wrap:wrap}
.count{font:400 11px 'JetBrains Mono',monospace;color:var(--muted)}
.count.bad{color:var(--alarm)}
/* One per line. Wrapped inline they broke at different points on every reload, so the
   block changed shape depending on which three came up — and a question that wraps mid
   clause is harder to read than one that owns its own row. */
.examples{margin-top:14px}
.examples > span{display:block;font:400 11px 'JetBrains Mono',monospace;
  color:var(--muted);margin-bottom:7px}
.eg{display:block;width:100%;text-align:left;background:none;
  border:1px dashed var(--rule);color:var(--muted);border-radius:2px;
  padding:9px 12px;margin-bottom:6px;
  font:400 13px/1.4 Archivo,sans-serif;text-transform:none;letter-spacing:0}
.eg:last-child{margin-bottom:0}
.eg:hover{border-color:var(--signal);color:var(--signal);background:none}

/* Before a run this page says nothing. Removing the placeholder text alone would have
   left the scaffolding behind it: .trace holds a 120px min-height and draws the lane
   rule, and .spent draws a divider, so an untouched page would show an empty ruled box
   above a stray horizontal line. Both collapse until there is something to put in them. */
.trace:empty{min-height:0}
.trace:empty::before{display:none}
.spent{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-soft);
  font:400 11px 'JetBrains Mono',monospace;color:var(--muted)}
.spent:empty{display:none}
</style>
</head>
<body>
<div class="wrap">

<header class="head">
  <div>
    <div class="eyebrow">Multi-agent report writer</div>
    <p class="sub">Ask a research question and get a cited briefing, with a list of
      anything it looked for and could not find.</p>
  </div>
  <a class="switch" href="/dev">dev</a>
</header>

<div class="controls">
  <textarea id="topic" maxlength="300" placeholder="e.g. How have battery storage costs changed the economics of rooftop solar in Europe since 2020?"></textarea>
  <div class="row">
    <span class="count" id="count">0 / 300</span>
    <button id="go" disabled>Write the report</button>
  </div>
  <div class="examples">
    <span>try:</span>
    <div id="egs"></div>
  </div>
</div>

<section class="trace" id="trace" aria-live="polite" aria-label="Node events"></section>
<div class="spent" id="spent"></div>

<section class="report" id="report" hidden>
  <h2 id="reportHead">Report</h2>
  <div class="md" id="md"></div>
  <div id="gaps"></div>
</section>

</div>

<script src="/static/trace.js"></script>
<script>
const $ = s => document.querySelector(s);
const MIN = 15, MAX = 300;
let BUDGETS = {searches:5, research_loops:1, revisions:2};

fetch('/api/topics').then(r=>r.json()).then(d=>{ BUDGETS = d.budgets; });

/* Twelve, three shown. Every one is a question with a measurable answer that the
   evidence might not settle — the shape the six frozen evaluation topics have, because
   that is what this system is for. A prompt that can be answered from one source does
   not need four agents. */
const IDEAS = [
  "Whether four-day working weeks raise productivity or simply redistribute the same hours",
  "How urban congestion charges affect emissions, and whether the reduction is real or displaced",
  "The measurable effect of remote work on commercial property values in mid-sized cities",
  "Whether microplastics in drinking water have demonstrated human health effects or only suspected ones",
  "How heat pump adoption is changing peak winter electricity demand in cold climates",
  "The evidence on whether school phone bans improve attainment or only reduce disruption",
  "Whether voluntary carbon offset markets have delivered verifiable emissions reductions",
  "How antibiotic use in livestock relates to resistance in human infections",
  "The effect of minimum unit pricing on alcohol consumption and alcohol-related harm",
  "Whether AI coding assistants change measured developer output or only perceived speed",
  "How lithium and nickel supply constraints are shaping electric vehicle prices",
  "What universal basic income trials measured about employment, health and wellbeing"
];

/* Fresh three on every load. Not stored, so a reload is a reroll — the point is to show
   the range of thing that works here, and a fixed pair only ever showed two of them. */
/* Fisher-Yates, not sort(() => Math.random() - 0.5). The comparator trick is the
   familiar one-liner and it is not uniform — the sort makes assumptions about a
   comparator that a random one breaks. Measured over 4000 draws it gave the twelve
   topics between 688 and 1546 appearances where 1000 is even; some questions would
   have shown up twice as often as others for no reason. */
function shuffled(list){
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawExamples(){
  const pick = shuffled(IDEAS).slice(0, 3);
  $('#egs').innerHTML = pick.map(q => `<button class="eg">${esc(q)}</button>`).join('');
  $('#egs').querySelectorAll('.eg').forEach(b => b.onclick = () => {
    ta.value = b.textContent.trim(); validate(); ta.focus();
  });
}

const ta = $('#topic');
function validate(){
  const n = ta.value.trim().length;
  $('#count').textContent = `${n} / ${MAX}`;
  $('#count').classList.toggle('bad', n>0 && n<MIN);
  $('#go').disabled = n < MIN;
}
ta.addEventListener('input', validate);
validate();
drawExamples();

function fail(title, detail){
  $('#report').hidden=false; $('#report').classList.add('err');
  $('#reportHead').textContent='Run failed';
  $('#md').innerHTML = `<p><strong>${esc(title)}</strong></p><p>${esc(detail)}</p>`;
  $('#gaps').innerHTML='';
  $('#go').disabled=false; $('#go').textContent='Write the report';
}

$('#go').onclick = async () => {
  const topic = ta.value.trim();
  const view = traceView($('#trace'), BUDGETS);
  view.reset(); $('#report').hidden=true; $('#report').classList.remove('err');
  $('#go').disabled=true; $('#go').textContent='Running…';
  $('#spent').textContent='Starting…';

  let res;
  try{
    res = await fetch('/api/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic})});
  }catch(err){ return fail('Could not reach the server', String(err)); }
  if(!res.ok) return fail(`Request rejected (${res.status})`,
    'The question needs to be between 15 and 300 characters.');

  await readSSE(res, {
    start: () => view.start(),
    node: d => {
      view.push(d);
      // Tokens only. No multiple: see the note at the top of the stylesheet.
      $('#spent').textContent = `${d.cost.tokens.toLocaleString()} tokens used so far`;
    },
    done: d => {
      view.finish();
      $('#report').hidden=false; $('#report').classList.remove('err');
      const words = d.report.trim().split(/\s+/).length;
      const cites = new Set(d.report.match(/F\d{3}/g)||[]).size;
      $('#spent').textContent = `${d.cost.tokens.toLocaleString()} tokens used`;
      $('#reportHead').textContent =
        `Report · ${words} words · ${cites} sources cited · ${d.findings.length} findings gathered`;
      $('#md').innerHTML = renderMarkdown(d.report);
      $('#gaps').innerHTML = gapsBlock(d.unclosed_gaps);
    },
    error: d => { view.finish(); fail(d.error, d.detail); },
  });

  $('#go').disabled=false; $('#go').textContent='Write the report';
};
</script>
</body>
</html>
