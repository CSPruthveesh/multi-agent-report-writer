<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report writer — Multi-Agent Report Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/trace.css">
<style>
/* Only what / has and /dev does not: the question box, and the summary box beside the
   report. No cost meter here — the multiple is the run over the mean of six single-agent
   runs on six fixed topics, and against a question typed into this box that denominator
   is the cost of a different task. */
/* 980, not 900. The report panel now has to carry a 208px box beside the prose, and at
   900 the text column came out at 552px — narrower than the 70ch it had before, which
   would have moved the whitespace rather than removed it. At 980 the prose sits at
   ~632px (~76ch, still a readable measure) and the box fills what is left. */
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px}
/* The masthead: the project name as the title, one line under it, and a way across to
   the instrument view. .eyebrow is 11px/500 in trace.css because on /dev it sits above
   a heading; here it IS the heading, so it takes the size and weight to match. */
.head .eyebrow{font-size:19px;font-weight:700;letter-spacing:.1em;
  line-height:1.15;margin-bottom:7px}

.controls{margin-bottom:26px}
textarea{
  width:100%;min-height:76px;resize:vertical;background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;padding:12px 13px;color:var(--ink);
  font:400 15px/1.5 Archivo,sans-serif}
textarea:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:11px;flex-wrap:wrap}
.count{font:400 11px 'JetBrains Mono',monospace;color:var(--muted)}
.count.bad{color:var(--alarm)}
/* One per line. Wrapped inline they broke at different points on every reload, so the
   block changed shape depending on which three came up — and a question that wraps mid
   clause is harder to read than one that owns its own row. */
.examples{margin-top:14px}
.examples > span{display:block;font:400 11px 'JetBrains Mono',monospace;
  color:var(--muted);margin-bottom:7px}
.eg{display:block;width:100%;text-align:left;background:none;
  border:1px dashed var(--rule);color:var(--muted);border-radius:2px;
  padding:9px 12px;margin-bottom:6px;
  font:400 13px/1.4 Archivo,sans-serif;text-transform:none;letter-spacing:0}
.eg:last-child{margin-bottom:0}
.eg:hover{border-color:var(--signal);color:var(--signal);background:none}

/* Before a run this page says nothing. Removing the placeholder text alone would have
   left the scaffolding behind it: .trace holds a 120px min-height and draws the lane
   rule, so an untouched page would show an empty ruled box. It collapses until there
   is something to put in it. */
.trace:empty{min-height:0}
.trace:empty::before{display:none}

/* ---------- the report, and the summary box beside it ----------
   The numbers used to run along the report's own header — REPORT · 1067 WORDS ·
   34 SOURCES CITED · 41 FINDINGS GATHERED — four figures in the position a title goes,
   directly above the report's actual title. They move out to their own card on the
   right, a sibling of the report rather than something inside it.
   Both children carry their own 34px top margin (the report's comes from trace.css),
   which with align-items:start lines their tops up without .results owning a margin
   that would show before a run, while both are hidden. */
.results{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:start}
/* An empty track still gets a gap drawn beside it, so a failed run — where the box is
   display:none — drops to a single column outright rather than losing 26px. */
.results:has(.stats[hidden]){grid-template-columns:1fr}
.report{min-width:0}
/* .md caps itself at 70ch for a readable measure, which inside the panel is where the
   whitespace came from. The column is now the measure, so the text fills it. */
.report .md{max-width:none}

/* On the gridded paper rather than inside the report panel, so it takes the panel's own
   fill — the same card treatment /dev gives the cost meter. Not sticky: it is a summary
   of a finished run, not a readout that tracks anything as you scroll. */
.stats{margin-top:34px;width:208px;background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;padding:15px 16px 14px}
.stats h3{font:500 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 12px}
/* Each figure is a button: pressing it says what it counts, and the citation count
   marks every reference in the text while it is held down. */
.stat{display:block;width:100%;background:none;border:0;border-radius:0;
  border-top:1px solid var(--rule-soft);padding:10px 0 9px;
  text-align:left;text-transform:none;letter-spacing:0;cursor:pointer}
.stat:first-child{border-top:0;padding-top:0}
.stat .v{display:block;font:700 22px/1 Archivo,sans-serif;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .k{display:block;margin-top:6px;font:500 9.5px/1.3 'JetBrains Mono',monospace;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat:hover:not(:disabled){background:none}
.stat:hover .v,.stat:hover .k,.stat.on .v,.stat.on .k{color:var(--signal)}
.stat.bad .v{color:var(--alarm)}
.note{margin-top:13px;padding-top:11px;border-top:1px solid var(--rule);
  font:400 11px/1.65 'JetBrains Mono',monospace;color:var(--muted)}
.note:empty{display:none}
/* the citation marks, while "sources cited" is pressed */
.md.hl cite{background:var(--signal);color:var(--panel)}

/* Stacked, with the summary first: on a phone the report is several screens long, and
   a box underneath it is a box nobody reaches. */
@media(max-width:720px){
  .results{grid-template-columns:1fr}
  .stats{width:auto;order:-1;margin-bottom:-10px}
}
</style>
</head>
<body>
<div class="wrap">

<header class="head">
  <div>
    <div class="eyebrow">Multi-agent report writer</div>
    <p class="sub">Ask a research question and get a cited briefing, with a list of
      anything it looked for and could not find.</p>
  </div>
  <a class="switch" href="/dev">dev</a>
</header>

<div class="controls">
  <textarea id="topic" maxlength="300" placeholder="e.g. How have battery storage costs changed the economics of rooftop solar in Europe since 2020?"></textarea>
  <div class="row">
    <span class="count" id="count">0 / 300</span>
    <button id="go" disabled>Write the report</button>
  </div>
  <div class="examples">
    <span>try:</span>
    <div id="egs"></div>
  </div>
</div>

<section class="trace" id="trace" aria-live="polite" aria-label="Node events"></section>

<div class="results">
  <section class="report" id="report" hidden>
    <h2 id="reportHead">Report</h2>
    <div class="md" id="md"></div>
    <div id="gaps"></div>
  </section>
  <aside class="stats" id="stats" hidden>
    <h3>This run</h3>
    <div id="statList"></div>
    <div class="note" id="note"></div>
  </aside>
</div>

</div>

<script src="/static/trace.js"></script>
<script>
const $ = s => document.querySelector(s);
const MIN = 15, MAX = 300;
let BUDGETS = {searches:5, research_loops:1, revisions:2};

fetch('/api/topics').then(r=>r.json()).then(d=>{ BUDGETS = d.budgets; });

/* Twelve, three shown. Every one is a question with a measurable answer that the
   evidence might not settle — the shape the six frozen evaluation topics have, because
   that is what this system is for. A prompt that can be answered from one source does
   not need four agents. */
const IDEAS = [
  "Whether four-day working weeks raise productivity or simply redistribute the same hours",
  "How urban congestion charges affect emissions, and whether the reduction is real or displaced",
  "The measurable effect of remote work on commercial property values in mid-sized cities",
  "Whether microplastics in drinking water have demonstrated human health effects or only suspected ones",
  "How heat pump adoption is changing peak winter electricity demand in cold climates",
  "The evidence on whether school phone bans improve attainment or only reduce disruption",
  "Whether voluntary carbon offset markets have delivered verifiable emissions reductions",
  "How antibiotic use in livestock relates to resistance in human infections",
  "The effect of minimum unit pricing on alcohol consumption and alcohol-related harm",
  "Whether AI coding assistants change measured developer output or only perceived speed",
  "How lithium and nickel supply constraints are shaping electric vehicle prices",
  "What universal basic income trials measured about employment, health and wellbeing"
];

/* Fresh three on every load. Not stored, so a reload is a reroll — the point is to show
   the range of thing that works here, and a fixed pair only ever showed two of them. */
/* Fisher-Yates, not sort(() => Math.random() - 0.5). The comparator trick is the
   familiar one-liner and it is not uniform — the sort makes assumptions about a
   comparator that a random one breaks. Measured over 4000 draws it gave the twelve
   topics between 688 and 1546 appearances where 1000 is even; some questions would
   have shown up twice as often as others for no reason. */
function shuffled(list){
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawExamples(){
  const pick = shuffled(IDEAS).slice(0, 3);
  $('#egs').innerHTML = pick.map(q => `<button class="eg">${esc(q)}</button>`).join('');
  $('#egs').querySelectorAll('.eg').forEach(b => b.onclick = () => {
    ta.value = b.textContent.trim(); validate(); ta.focus();
  });
}

const ta = $('#topic');
function validate(){
  const n = ta.value.trim().length;
  $('#count').textContent = `${n} / ${MAX}`;
  $('#count').classList.toggle('bad', n>0 && n<MIN);
  $('#go').disabled = n < MIN;
}
ta.addEventListener('input', validate);
validate();
drawExamples();

function fail(title, detail){
  $('#report').hidden=false; $('#report').classList.add('err');
  $('#stats').hidden=true;
  $('#reportHead').textContent='Run failed';
  $('#md').innerHTML = `<p><strong>${esc(title)}</strong></p><p>${esc(detail)}</p>`;
  $('#gaps').innerHTML='';
  $('#go').disabled=false; $('#go').textContent='Write the report';
}

/* The summary box.
 *
 * Every row is a figure the reader might reasonably distrust, so every row can be
 * pressed for the sentence that says what it counts — "34 sources cited" means nothing
 * until you know 41 were gathered and the writer only cites what it uses. Pressing the
 * citation count also marks the references in the text, which is the only claim here
 * that can be checked by looking.
 *
 * One row open at a time. Two notes stacked would push the box taller than the first
 * screen of the report it is annotating. */
function showStats(d){
  const words = d.report.trim().split(/\s+/).length;
  const cited = new Set(d.report.match(/F\d{3}/g) || []).size;
  const found = (d.findings || []).length;
  const gaps  = (d.unclosed_gaps || []).length;

  const rows = [
    {v: words.toLocaleString(), k: 'words',
     note: 'Length of the finished report, after the critic’s pass.'},
    {v: cited, k: 'sources cited', hl: true,
     note: `Distinct findings quoted in the text — marked in green while this is pressed.`},
    // max(0, …): a broken citation puts an F-number in the text that no finding backs,
    // which would make the subtraction negative.
    {v: found, k: 'findings gathered',
     note: (unused => unused
       ? `Everything the researcher collected. ${unused} ${unused === 1 ? 'was' : 'were'}
          not used — the writer cites what the argument needs, not all of it.`
       : 'Everything the researcher collected, all of it cited.'
     )(Math.max(0, found - cited))},
  ];
  if (gaps) rows.push({v: gaps, k: gaps === 1 ? 'gap unclosed' : 'gaps unclosed', bad: true,
     note: 'Evidence it went looking for and could not find. Listed under the report.'});
  rows.push({v: d.cost.tokens.toLocaleString(), k: 'tokens',
     note: 'Model tokens across all four agents, prompts and replies together.'});

  const list = $('#statList');
  list.innerHTML = rows.map((r, i) =>
    `<button class="stat${r.bad ? ' bad' : ''}" data-i="${i}" aria-pressed="false">
       <span class="v">${esc(r.v)}</span><span class="k">${esc(r.k)}</span></button>`).join('');

  const btns = [...list.querySelectorAll('.stat')];
  btns.forEach(b => b.onclick = () => {
    const open = !b.classList.contains('on');
    btns.forEach(o => { o.classList.remove('on'); o.setAttribute('aria-pressed','false'); });
    b.classList.toggle('on', open);
    b.setAttribute('aria-pressed', String(open));
    $('#note').textContent = open ? rows[b.dataset.i].note.replace(/\s+/g,' ') : '';
    $('#md').classList.toggle('hl', open && !!rows[b.dataset.i].hl);
  });

  $('#note').textContent = '';
  $('#md').classList.remove('hl');
  $('#stats').hidden = false;
}

$('#go').onclick = async () => {
  const topic = ta.value.trim();
  const view = traceView($('#trace'), BUDGETS);
  view.reset(); $('#report').hidden=true; $('#report').classList.remove('err');
  $('#stats').hidden=true; $('#md').classList.remove('hl');
  $('#go').disabled=true; $('#go').textContent='Running…';

  let res;
  try{
    res = await fetch('/api/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({topic})});
  }catch(err){ return fail('Could not reach the server', String(err)); }
  if(!res.ok) return fail(`Request rejected (${res.status})`,
    'The question needs to be between 15 and 300 characters.');

  await readSSE(res, {
    start: () => view.start(),
    node: d => view.push(d),
    done: d => {
      view.finish();
      $('#report').hidden=false; $('#report').classList.remove('err');
      $('#reportHead').textContent = 'Report';
      $('#md').innerHTML = renderMarkdown(d.report);
      $('#gaps').innerHTML = gapsBlock(d.unclosed_gaps);
      showStats(d);
    },
    error: d => { view.finish(); fail(d.error, d.detail); },
  });

  $('#go').disabled=false; $('#go').textContent='Write the report';
};
</script>
</body>
</html>
