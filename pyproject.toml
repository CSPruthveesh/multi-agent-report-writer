[project]
name = "multi-agent-report-writer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "fastapi>=0.140.13",
    "google-genai>=2.14.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "sse-starlette>=3.4.6",
    "tavily-python>=0.7.26",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
